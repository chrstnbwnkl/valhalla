name: qa

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    # runs on github's runner so unauthorized requests never occupy the hetzner box
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/qa')
    runs-on: ubuntu-latest
    permissions:
      issues: write # for the reaction on the comment
      pull-requests: write
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: context.actor })
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              core.setFailed(`${context.actor} is not allowed to trigger qa`)
              return
            }

            // pin both shas now so pushes after the comment can't sneak into this run
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number })
            const { data: master } = await github.rest.repos.getBranch({
              owner, repo, branch: 'master' })
            core.setOutput('base_sha', master.commit.sha)
            core.setOutput('head_sha', pr.head.sha)

            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: 'rocket' })

  qa:
    needs: gate
    runs-on: [self-hosted, hetzner-qa, chris-hetzner-dedicated]
    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,/var/cache/vcpkg,readwrite"
      QA_PBF: /home/gh-actions/switzerland-250101.pbf
      QA_PORT: "8002"
    steps:
      - name: checkout fork master
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          path: base
          submodules: recursive # valhalla vendors third_party deps as submodules
          persist-credentials: false
 
      - name: checkout pr
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          submodules: recursive
          persist-credentials: false
 
      - name: checkout qa harness
        uses: actions/checkout@v4
        with:
          repository: chrstnbwnkl/valhalla-qa
          path: harness
          persist-credentials: false
 
      - name: update vcpkg registry
        run: git -C "$VCPKG_ROOT" fetch --quiet origin
 
      - name: build, tile, serve, qa
        run: |
          set -euo pipefail
          pid=""
          trap '[[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true' EXIT
 
          for tree in base pr; do
            echo "::group::$tree: build"
            cmake -S "$tree" -B "$tree/build" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DENABLE_TESTS=OFF -DENABLE_PYTHON_BINDINGS=OFF -DENABLE_SINGLE_FILES_WERROR=OFF
            cmake --build "$tree/build" -j12
            echo "::endgroup::"
 
            echo "::group::$tree: tiles"
            # each tree generates its own config, the schema may change in the pr
            mkdir -p "$tree/tiles"
            python3 "$tree/scripts/valhalla_build_config" \
              --mjolnir-tile-dir "$PWD/$tree/tiles" \
              --mjolnir-tile-extract "$PWD/$tree/tiles.tar" \
              --mjolnir-timezone "/home/gh-actions/tz_world.sqlite" \
              --mjolnir-admin "/home/gh-actions/admin.sqlite" \
              --httpd-service-listen "tcp://*:$QA_PORT" > "$tree/valhalla.json"
            "$tree/build/valhalla_build_tiles" -c "$tree/valhalla.json" "$QA_PBF"
            echo "::endgroup::"
 
            echo "::group::$tree: qa"
            "$tree/build/valhalla_service" "$tree/valhalla.json" 4 > "$tree/service.log" 2>&1 &
            pid=$!
            for _ in $(seq 120); do
              curl -fs "http://localhost:$QA_PORT/status" > /dev/null && break
              kill -0 "$pid" 2>/dev/null || { cat "$tree/service.log"; exit 1; }
              sleep 1
            done
            curl -fs "http://localhost:$QA_PORT/status" > /dev/null # fail if never came up
 
            python3 harness/run_requests.py --valhalla-url "http://localhost:$QA_PORT" -j4 \ 
                    --output "results/$tree"
 
            kill "$pid"; wait "$pid" 2>/dev/null || true
            pid=""
            echo "::endgroup::"
          done
 
      - name: summary
        run: python3 harness/summary.py results/base results/pr --output results_bundled  | tee -a "$GITHUB_STEP_SUMMARY" 
 
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: results_bundled/
 
